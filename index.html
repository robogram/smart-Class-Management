                                    </div>

                                    {detailSession.notes && (
                                        <div>
                                            <h4 className="text-lg font-black text-gray-800 mb-3 flex items-center gap-2"><i className="fas fa-comment-dots text-orange-500"></i> 특이 사항 및 학생 반응</h4>
                                            <p className="whitespace-pre-wrap text-gray-700 bg-orange-50/50 p-5 rounded-2xl border border-orange-100/50 leading-relaxed font-medium break-keep">
                                                {detailSession.notes}
                                            </p>
                                        </div>
                                    )}
                                    {/* [추가] 소통 피드백 댓글 창 */}
                                    <div className="border-t border-gray-100 pt-6">
                                        <h4 className="text-lg font-black text-gray-800 mb-4 flex items-center gap-2">
                                            <i className="fas fa-comments text-indigo-500"></i> 수업 소통 및 피드백 Feed ({detailSession.comments?.length || 0})
                                        </h4>
                                        
                                        {/* 댓글 리스트 */}
                                        <div className="space-y-3 max-h-48 overflow-y-auto pr-2 mb-4">
                                            {(detailSession.comments && detailSession.comments.length > 0) ? (
                                                detailSession.comments.map(c => {
                                                    const isWriter = c.writerName === user.name;
                                                    const roleBadgeColor = 
                                                        c.writerRole === 'admin' ? 'bg-blue-100 text-blue-800 border-blue-200' :
                                                        c.writerRole === 'teacher' ? 'bg-green-100 text-green-800 border-green-200' :
                                                        'bg-orange-100 text-orange-800 border-orange-200';
                                                    const roleLabel = 
                                                        c.writerRole === 'admin' ? '관리자' :
                                                        c.writerRole === 'teacher' ? '학교교사' : '강사';

                                                    return (
                                                        <div key={c.id} className="bg-slate-50 border border-slate-100 p-3 rounded-xl flex flex-col gap-1 shadow-sm relative group">
                                                            <div className="flex justify-between items-center text-xs">
                                                                <div className="flex items-center gap-1.5 font-bold">
                                                                    <span className="text-gray-800">{c.writerName}</span>
                                                                    <span className={`text-[9px] px-1.5 py-0.5 rounded border font-bold ${roleBadgeColor}`}>{roleLabel}</span>
                                                                </div>
                                                                <div className="flex items-center gap-2 text-gray-400 font-medium">
                                                                    <span>{c.date}</span>
                                                                    {(isWriter || user.role === 'admin') && (
                                                                        <button 
                                                                            onClick={() => handleDeleteComment(c.id)} 
                                                                            className="text-gray-400 hover:text-red-500 transition-colors p-1"
                                                                        >
                                                                            <i className="fas fa-trash-alt text-[10px]"></i>
                                                                        </button>
                                                                    )}
                                                                </div>
                                                            </div>
                                                            <p className="text-sm text-gray-700 leading-relaxed font-medium break-keep mt-1">{c.content}</p>
                                                        </div>
                                                    );
                                                })
                                            ) : (
                                                <p className="text-xs text-gray-400 font-bold text-center py-4">아직 소통 피드백이 없습니다. 첫 댓글을 남겨보세요!</p>
                                            )}
                                        </div>

                                        {/* 댓글 입력창 */}
                                        <div className="flex gap-2">
                                            <input 
                                                type="text" 
                                                value={newCommentText}
                                                onChange={e => setNewCommentText(e.target.value)}
                                                onKeyDown={e => { if (e.key === 'Enter') handleAddComment(); }}
                                                placeholder="수업에 대한 따뜻한 응원이나 피드백을 남겨주세요..."
                                                className="flex-1 px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-500 outline-none text-sm font-bold shadow-sm transition-all bg-slate-50 focus:bg-white"
                                            />
                                            <button 
                                                onClick={handleAddComment}
                                                className="px-5 py-3 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold rounded-xl text-sm shadow-md transition-all shrink-0"
                                            >
                                                등록
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div className="p-6 border-t border-gray-100 bg-gray-50 flex justify-end gap-3">
                                    <button onClick={() => triggerPrint(detailSession.id)} className="px-6 py-3.5 bg-gray-800 hover:bg-black text-white font-bold rounded-xl flex items-center gap-2 shadow-md transition-colors"><i className="fas fa-print"></i> 이 차시만 인쇄 (PDF)</button>
                                    <button onClick={() => setDetailSession(null)} className="px-6 py-3.5 bg-white border border-gray-300 font-bold rounded-xl text-gray-700 hover:bg-gray-50 shadow-sm transition-colors">닫기</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- 🖨️ [추가 3] 인쇄용 (PDF) 숨김 레이아웃 --- */}
                    {/* 평소 화면에서는 안 보이고 인쇄 버튼을 누를 때만 하얀 A4 용지 형태로 나타납니다. */}
                    <div id="print-section" className="hidden print:block w-full bg-white text-black p-4">
                        <div className="text-center mb-10 pb-6 border-b-4 border-gray-800">
                            <h1 className="text-4xl font-black mb-3 text-gray-900">{userClass.school} - {userClass.name}</h1>
                            <p className="text-2xl font-bold text-gray-600">차시별 수업보고서 {printTarget === 'all' ? '(전체 통합)' : `(${printTarget}차시 개별)`}</p>
                        </div>

                        {displaySessions.filter(s => s.status === 'completed' && (printTarget === 'all' || s.id === printTarget)).map((session, idx, arr) => (
                            <div key={session.id} className={`mb-12 ${idx !== arr.length - 1 ? 'page-break border-b-2 border-dashed border-gray-300 pb-12' : ''}`}>
                                <div className="flex justify-between items-end mb-6 pb-3 border-b border-gray-300">
                                    <h2 className="text-3xl font-black text-gray-900">{session.id}차시 수업보고서</h2>
                                    <span className="text-xl font-bold text-gray-600">수업일: {session.dateLabel}</span>
                                </div>
                                
                                {session.photoData && (
                                    <div className="mb-8 text-center">
                                        <img src={session.photoData} alt="현장사진" className="max-h-[450px] mx-auto object-contain border border-gray-200 rounded-2xl p-2 shadow-sm" />
                                    </div>
                                )}

                                <div className="mb-8">
                                    <h3 className="text-2xl font-black mb-4 text-gray-800 bg-gray-100 p-3 rounded-lg inline-block">1. 주요 수업 내용</h3>
                                    <p className="whitespace-pre-wrap text-lg text-gray-800 leading-loose p-2">{session.content}</p>
                                </div>

                                {session.notes && (
                                    <div>
                                        <h3 className="text-2xl font-black mb-4 text-gray-800 bg-gray-100 p-3 rounded-lg inline-block">2. 특이 사항 및 학생 반응</h3>
                                        <p className="whitespace-pre-wrap text-lg text-gray-800 leading-loose p-2">{session.notes}</p>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </>
            );
        }

        function ReportEditView({ user, sessionId, classes, updateClass, navigateTo, adminClassId }) {
            const isAdmin = user.role === 'admin';
            const userClass = isAdmin 
                ? classes.find(c => c.id === adminClassId) 
                : classes.find(c => c.id === user.selectedClassId) ||
                  (user.role === 'instructor'
                    ? classes.find(c => c.instructorEmail === user.email && isSchoolMatch(c.school, user.school))
                    : classes.find(c => c.teacherEmail === user.email && isSchoolMatch(c.school, user.school))
                  );
            
            let sessionDayMapping = [];
            (userClass.schedule || []).forEach(day => {
                for(let i=0; i<Number(day.sessions); i++) sessionDayMapping.push(day.label);
            });

            const existingReport = (userClass.reports || []).find(r => r.id === sessionId);
            const defaultData = existingReport || { id: sessionId, dateLabel: sessionDayMapping[sessionId - 1] || '-', status: 'pending', content: '', notes: '', photoUploaded: false, photoData: null };

            const [formData, setFormData] = useState(defaultData);
            const [photoPreview, setPhotoPreview] = useState(formData.photoData || null);

            // [추가] 임시 저장 상태 및 키
            const [isAutoSaving, setIsAutoSaving] = useState(false);
            const saveKey = `edusync_autosave_${userClass.id}_session_${sessionId}`;

            // [추가] 1. 컴포넌트 마운트 시 임시 저장 복구 검사
            useEffect(() => {
                const savedData = localStorage.getItem(saveKey);
                if (savedData) {
                    try {
                        const parsed = JSON.parse(savedData);
                        if (parsed.content || parsed.notes || parsed.photoData) {
                            if (window.confirm("이전에 작성 중이던 자동 임시 저장 데이터가 있습니다. 복구하시겠습니까?")) {
                                setFormData(prev => ({
                                    ...prev,
                                    content: parsed.content || prev.content,
                                    notes: parsed.notes || prev.notes,
                                    photoUploaded: parsed.photoUploaded !== undefined ? parsed.photoUploaded : prev.photoUploaded,
                                    photoData: parsed.photoData || prev.photoData
                                }));
                                if (parsed.photoData) {
                                    setPhotoPreview(parsed.photoData);
                                }
                            } else {
                                localStorage.removeItem(saveKey);
                            }
                        }
                    } catch (e) {
                        console.error("임시 저장 복구 실패:", e);
                    }
                }
            }, []);

            // [추가] 2. 변경 데이터 0.5초 디바운싱 자동 저장
            useEffect(() => {
                const timer = setTimeout(() => {
                    if (formData.content || formData.notes || formData.photoData) {
                        setIsAutoSaving(true);
                        localStorage.setItem(saveKey, JSON.stringify({
                            content: formData.content,
                            notes: formData.notes,
                            photoUploaded: formData.photoUploaded,
                            photoData: formData.photoData
                        }));
                        setTimeout(() => setIsAutoSaving(false), 800);
                    }
                }, 500);

                return () => clearTimeout(timer);
            }, [formData.content, formData.notes, formData.photoData]);

            // [추가] 타 차시 이미지 자동 재압축 유틸리티 함수
            const compressExistingBase64 = (base64Str) => {
                return new Promise((resolve) => {
                    if (!base64Str || !base64Str.startsWith('data:image')) {
                        resolve(base64Str);
                        return;
                    }
                    const img = new Image();
                    img.onload = () => {
                        const MAX_SIZE = 600;
                        let width = img.width;
                        let height = img.height;

                        if (width > height && width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        } else if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressed = canvas.toDataURL('image/jpeg', 0.5); // 용량 최소화를 위해 50% 퀄리티 압축
                        resolve(compressed);
                    };
                    img.onerror = () => resolve(base64Str);
                    img.src = base64Str;
                });
            };

            const handleSave = async () => {
                try {
                    const otherReports = (userClass.reports || []).filter(r => r.id !== sessionId);
                    const newReport = { ...formData, status: 'completed' };
                    
                    // 1. Firestore 클라우드 저장 (Base64 데이터가 350px로 초고압축되어 저장되므로 한도를 넘지 않음)
                    await updateClass(userClass.id, { reports: [...otherReports, newReport] });
                    
                    // 2. LMS 서버(Cafe24) 실시간 동기화 전송
                    let subjectType = "잼S";
                    if (userClass.name && userClass.name.includes("로보미")) {
                        subjectType = "로보미";
                    }
                    
                    await fetch("https://scko362485.mycafe24.com/sync_to_lms.php", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            school: userClass.school,
                            subject: subjectType,
                            chasi: sessionId,
                            content: formData.content,
                            notes: formData.notes,
                            photoData: formData.photoData,
                            instructorEmail: userClass.instructorEmail
                        })
                    });
                    
                    localStorage.removeItem(saveKey);
                    alert('수업보고서가 안전하게 클라우드 DB에 동기화 저장되었습니다.');
                    navigateTo('report_list', adminClassId);
                    
                } catch (err) {
                    console.error("저장 최종 오류:", err);
                    alert("저장 처리 중 에러가 발생했습니다: " + (err.message || err.toString()));
                }
            };

            const handleDelete = async () => {
                if(window.confirm('테스트로 작성한 내용이나 사진을 모두 삭제하고 처음 상태로 초기화하시겠습니까?')) {
                    const otherReports = (userClass.reports || []).filter(r => r.id !== sessionId);
                    await updateClass(userClass.id, { reports: otherReports });
                    localStorage.removeItem(saveKey);
                    alert('보고서 내용이 초기화되었습니다.');
                    navigateTo('report_list', adminClassId);
                }
            };

            const handlePhotoUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onloadend = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        // 1. 최대 해상도 제한 (가로 또는 세로 350px로 초고압축하여 Firestore 1MB 제한 우회)
                        const MAX_SIZE = 350;
                        let width = img.width;
                        let height = img.height;

                        if (width > height && width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        } else if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }

                        // 2. 캔버스에 리사이징된 이미지 그리기
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // 3. JPEG 포맷으로 품질을 40%로 낮춰 압축 (용량을 장당 10KB 내외로 극대화 축소하여 1MB 에러 완벽 해결)
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.40);

                        // 4. 압축된 데이터로 화면 미리보기 및 DB 저장 상태 업데이트
                        setPhotoPreview(compressedDataUrl);
                        setFormData({...formData, photoUploaded: true, photoData: compressedDataUrl});
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            return (
                <div className="max-w-4xl mx-auto fade-in relative z-10">
                    <div className="bg-white/90 backdrop-blur-xl rounded-[2rem] border border-white/60 shadow-2xl overflow-hidden">
                        <div className="bg-gradient-to-r from-robogram-blue to-indigo-700 p-8 text-white flex justify-between items-center">
                            <div>
                                <h2 className="text-3xl font-black break-keep mb-2">{formData.id}차시 수업보고서 {isAdmin ? '검토 및 직접 수정' : '작성'}</h2>
                                <p className="text-blue-100 font-medium opacity-90 break-keep flex items-center gap-2"><i className="far fa-calendar-alt"></i> {formData.dateLabel} 배정된 수업 내역</p>
                            </div>
                            <div className="flex flex-col items-end gap-2 text-right">
                                <span className="bg-white/20 px-4 py-1.5 rounded-full text-sm font-bold backdrop-blur-sm break-keep border border-white/20 shadow-sm"><i className="fas fa-cloud-upload-alt text-green-300 mr-1"></i> 실시간 DB 자동저장 지원</span>
                                {isAutoSaving ? (
                                    <span className="text-xs bg-green-500 text-white px-3 py-1 rounded-full font-bold flex items-center gap-1.5 shadow-sm animate-pulse">
                                        <i className="fas fa-save animate-spin"></i> 로컬 임시저장 중...
                                    </span>
                                ) : (
                                    <span className="text-[11px] text-blue-200 opacity-80 font-bold">
                                        <i className="fas fa-check-circle text-green-300"></i> 임시저장 안전망 작동중
                                    </span>
                                )}
                            </div>
                        </div>
                        <div className="p-8 md:p-10 space-y-8">
                            <div>
                                <label className="block text-base font-black text-gray-800 mb-3 break-keep flex items-center gap-2"><i className="fas fa-edit text-robogram-blue"></i> 주요 수업 내용 (필수)</label>
                                <textarea rows={6} className="w-full px-5 py-4 rounded-2xl border border-white bg-white/80 focus:bg-white focus:border-robogram-blue outline-none resize-none transition-all font-bold text-gray-900 leading-relaxed shadow-sm" placeholder="오늘 진행한 수업의 구체적인 내용, 목표 달성 여부 등을 상세히 기록해 주세요." value={formData.content} onChange={(e) => setFormData({...formData, content: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-base font-black text-gray-800 mb-3 break-keep flex items-center gap-2"><i className="fas fa-comment-dots text-orange-500"></i> 특이 사항 및 학생 반응</label>
                                <textarea rows={4} className="w-full px-5 py-4 rounded-2xl border border-white bg-white/80 focus:bg-white focus:border-robogram-blue outline-none resize-none transition-all font-bold text-gray-900 leading-relaxed shadow-sm" placeholder="수업 중 학생들의 특별한 반응, 발생한 문제점이나 다음 차시를 위한 메모를 남겨주세요." value={formData.notes} onChange={(e) => setFormData({...formData, notes: e.target.value})} />
                            </div>
                            <div>
                                <label className="block text-base font-black text-gray-800 mb-3 break-keep flex items-center gap-2"><i className="fas fa-camera text-green-500"></i> 현장 사진 첨부 및 미리보기</label>
                                <label className={`block border-2 border-dashed rounded-2xl p-10 text-center transition-all cursor-pointer shadow-sm ${formData.photoUploaded && photoPreview ? 'border-robogram-blue bg-blue-50/40' : 'border-gray-300 hover:bg-white hover:border-robogram-blue bg-white/50'}`}>
                                    <input 
                                        type="file" 
                                        accept="image/png, image/jpeg, image/jpg" 
                                        className="hidden" 
                                        onChange={handlePhotoUpload} 
                                    />
                                    {formData.photoUploaded && photoPreview ? (
                                        <div className="flex flex-col items-center text-robogram-blue w-full">
                                            <div className="relative w-full max-w-md mx-auto mb-5 rounded-2xl overflow-hidden border-[6px] border-white shadow-lg bg-white group">
                                                <img src={photoPreview} alt="업로드된 현장 사진" className="w-full h-auto max-h-64 object-contain" />
                                                <button 
                                                    onClick={(e) => {
                                                        e.preventDefault();
                                                        e.stopPropagation();
                                                        if (confirm("첨부된 사진을 삭제하시겠습니까?")) {
                                                            setPhotoPreview(null);
                                                            setFormData({ ...formData, photoUploaded: false, photoData: null });
                                                        }
                                                    }}
                                                    className="absolute top-3 right-3 w-10 h-10 rounded-full bg-red-500 hover:bg-red-600 text-white flex items-center justify-center shadow-lg transition-colors border border-red-400 z-10"
                                                    title="사진 삭제"
                                                >
                                                    <i className="fas fa-trash-alt"></i>
                                                </button>
                                            </div>
                                            <span className="font-black text-lg break-keep mb-1 flex items-center gap-2"><i className="fas fa-check-circle text-2xl"></i> 현장 사진이 성공적으로 첨부되었습니다!</span>
                                            <span className="text-sm font-bold opacity-70 break-keep underline underline-offset-4 mt-2">(다른 사진으로 교체하시려면 사진 밖 빈 곳을 클릭하고, 삭제는 이미지 우측 상단 휴지통 버튼을 누르세요)</span>
                                        </div>
                           ) : (
                                        <div className="flex flex-col items-center text-gray-500">
                                            <div className="w-16 h-16 rounded-full bg-white shadow-sm flex items-center justify-center mb-4 border border-gray-100">
                                                <i className="fas fa-cloud-upload-alt text-[32px] text-gray-400"></i>
                                            </div>
                                            <span className="font-black text-lg break-keep text-gray-800 mb-1">클릭하여 생생한 현장 사진을 업로드하세요</span>
                                            {/* 강사님이 안심할 수 있도록 압축 안내 문구 추가 */}
                                            <span className="text-sm font-medium text-robogram-blue bg-blue-50 px-3 py-1 rounded-full mt-2 border border-blue-100 break-keep">
                                                <i className="fas fa-magic"></i> 스마트폰 고화질 사진 자동 압축 적용 중
                                            </span>
                                        </div>
                                    )}
                                </label>
                            </div>
                        </div>
                        <div className="p-6 md:p-8 bg-white/60 border-t border-white flex justify-end gap-4 rounded-b-[2rem]">
                            {/* [추가] 기존에 DB에 저장된 데이터가 있을 때만 '내용 초기화' 버튼 노출 */}
                            {existingReport && (
                                <button onClick={handleDelete} className="px-6 py-3.5 rounded-xl font-bold text-red-500 bg-red-50 border border-red-100 hover:bg-red-100 transition-colors break-keep shadow-sm mr-auto flex items-center gap-2">
                                    <i className="fas fa-undo"></i> 내용 초기화
                                </button>
                            )}
                            <button onClick={() => navigateTo('report_list', adminClassId)} className="px-6 py-3.5 rounded-xl font-bold text-gray-700 bg-white border border-gray-200 hover:bg-gray-50 transition-colors break-keep shadow-sm">작성 취소</button>
                            <button onClick={handleSave} className="px-8 py-3.5 bg-robogram-blue hover:bg-robogram-lightBlue active:bg-blue-800 text-white rounded-xl font-black text-lg shadow-xl shadow-robogram-blue/30 transition-all break-keep flex items-center gap-2"><i className="fas fa-save"></i> 클라우드 저장 및 동기화</button>
                        </div>
                    </div>
                </div>
            );
        }

        function FileViewerModal({ file, onClose }) {
            const iframeRef = useRef(null);

            if (!file) return null;

            const handlePrint = () => {
                if (!file.content) return;
                
                try {
                    // 1. PDF 보고서인 경우
                    if (file.name.toLowerCase().endsWith('.pdf')) {
                        const newWindow = window.open();
                        if (newWindow) {
                            newWindow.document.write(
                                `<title>${file.name}</title>` +
                                `<body style="margin:0;padding:0;overflow:hidden;background:#525659;">` +
                                `<embed width="100%" height="100%" src="${file.content}" type="application/pdf" style="border:none;" />` +
                                `</body>`
                            );
                            newWindow.document.close();
                        } else {
                            // 팝업 차단 시 대체 직접 다운로드/보기 유도
                            const link = document.createElement('a');
                            link.href = file.content;
                            link.target = '_blank';
                            link.download = file.name;
                            link.click();
                        }
                    } 
                    // 2. HTML 보고서인 경우
                    else {
                        const printWindow = window.open('', '_blank');
                        if (printWindow) {
                            printWindow.document.write(file.content);
                            printWindow.document.close();
                            printWindow.focus();
                            setTimeout(() => {
                                printWindow.print();
                            }, 250);
                        } else {
                            alert('브라우저의 팝업 차단을 해제해 주셔야 보고서 인쇄가 정상 작동합니다.');
                        }
                    }
                } catch (e) {
                    console.error("인쇄 엔진 에러:", e);
                    alert("인쇄를 시작할 수 없습니다. 파일을 다운로드하여 확인해 주세요.");
                }
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/75 backdrop-blur-md p-4 md:p-10 fade-in">
                    <div className="bg-white rounded-[2rem] shadow-2xl w-full max-w-6xl h-full flex flex-col overflow-hidden border border-gray-200">
                        <div className="flex justify-between items-center p-5 md:p-6 border-b border-gray-100 bg-gray-50/50">
                            <div className="flex items-center gap-4">
                                <div className={`w-12 h-12 rounded-xl flex items-center justify-center shadow-sm border border-white ${file.name.toLowerCase().endsWith('.pdf') ? 'bg-red-50 text-red-600' : 'bg-orange-50 text-orange-600'}`}>
                                    <i className={`fas ${file.name.toLowerCase().endsWith('.pdf') ? 'fa-file-pdf' : 'fa-code'} text-2xl`}></i>
                                </div>
                                <div><h3 className="font-black text-xl text-gray-800 break-keep mb-0.5">{file.name}</h3><p className="text-sm font-medium text-gray-500 break-keep flex items-center gap-2"><i className="fas fa-laptop text-xs"></i> {file.className} <span className="opacity-50">|</span> <i className="far fa-clock text-xs"></i> {file.date}</p></div>
                            </div>
                            <div className="flex items-center gap-3">
                                {file.content && (
                                    <button 
                                        onClick={handlePrint}
                                        className="px-5 py-3 text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 rounded-xl transition-all font-black flex items-center gap-2 break-keep shadow-md"
                                    >
                                        <i className="fas fa-print"></i> 보고서 인쇄 (PDF 저장)
                                    </button>
                                )}
                                <button onClick={onClose} className="px-5 py-3 text-gray-600 bg-white border border-gray-200 hover:text-red-600 hover:bg-red-50 hover:border-red-100 rounded-xl transition-all font-black flex items-center gap-2 break-keep shadow-sm"><i className="fas fa-times text-lg"></i> 닫기</button>
                            </div>
                        </div>
                        <div className="flex-1 bg-gray-100 relative">
                            {file.content ? (
                                file.name.toLowerCase().endsWith('.pdf') ? <iframe ref={iframeRef} src={file.content} className="w-full h-full border-0 absolute inset-0 bg-white" title="PDF Viewer"></iframe>
                                : <iframe ref={iframeRef} srcDoc={file.content} className="w-full h-full border-0 absolute inset-0 bg-white" title="HTML Viewer" sandbox="allow-scripts allow-same-origin"></iframe>
                            ) : <div className="flex flex-col items-center justify-center h-full text-gray-500 bg-white"><i className="fas fa-file-excel text-6xl mb-4 text-gray-300"></i><p className="text-lg font-bold break-keep">파일 내용을 불러올 수 없거나 지원하지 않는 형식입니다.</p></div>}
                        </div>
                    </div>
                </div>
            );
        }

        // --- [보고서 승인 관리] 관리자 전용: LMS REST API에서 직접 보고서 조회/승인 ---
        const LMS_API_URL = 'https://scko362485.mycafe24.com/bbs/report_api.php';

        function PendingReportsView({ classes, updateClass, navigateTo }) {
            const [lmsReports, setLmsReports] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [approvingId, setApprovingId] = useState(null);
            const [expandedId, setExpandedId] = useState(null);
            const [error, setError] = useState('');

            // LMS API에서 pending 보고서 로드
            const loadReports = async () => {
                setIsLoading(true);
                setError('');
                try {
                    const res = await fetch(LMS_API_URL + '?status=pending', { cache: 'no-store' });
                    const data = await res.json();
                    if (data.ok) {
                        setLmsReports(data.reports || []);
                    } else {
                        setError('보고서를 불러오는 데 실패했습니다.');
                    }
                } catch (e) {
                    setError('LMS 서버 연결 오류: ' + e.message);
                } finally {
                    setIsLoading(false);
                }
            };

            useEffect(() => { loadReports(); }, []);

            const handleApprove = async (report) => {
                if (!confirm(`[${report.school}] ${report.chasi} 보고서를 승인하시겠습니까?\n승인 후 학교 선생님이 열람할 수 있습니다.`)) return;
                setApprovingId(report.wr_id);
                try {
                    // 1. LMS DB에 승인 처리
                    const res = await fetch(LMS_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ wr_id: report.wr_id, action: 'approve' })
                    });
                    const data = await res.json();
                    if (!data.ok) throw new Error(data.message);

                    // 2. Firestore classes에도 completed 상태로 동기화
                    const chasi = parseInt(report.chasi) || 0;
                    const matchedClass = classes.find(c =>
                        isSchoolMatch(c.school, report.school)
                    );
                    if (matchedClass && chasi) {
                        const existingReports = matchedClass.reports || [];
                        const otherReports = existingReports.filter(r => r.id !== chasi);
                        const newReport = {
                            id: chasi,
                            dateLabel: chasi + '차시',
                            status: 'completed',
                            content: report.content || '',
                            notes: report.notes || '',
                            photoUploaded: !!report.photoUrl,
                            photoData: report.photoUrl || '',
                            approvedAt: Date.now()
                        };
                        await updateClass(matchedClass.id, { reports: [...otherReports, newReport].sort((a,b)=>a.id-b.id) });
                    }

                    alert(`✅ [${report.school}] ${report.chasi} 보고서가 승인되었습니다.\n학교 선생님이 이제 열람할 수 있습니다.`);
                    loadReports(); // 목록 갱신
                } catch (e) {
                    alert('승인 처리 중 오류가 발생했습니다: ' + e.message);
                    console.error(e);
                } finally {
                    setApprovingId(null);
                }
            };

            const handleReject = async (report) => {
                if (!confirm(`[${report.school}] ${report.chasi} 보고서를 반려하시겠습니까?`)) return;
                try {
                    const res = await fetch(LMS_API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ wr_id: report.wr_id, action: 'reject' })
                    });
                    const data = await res.json();
                    if (!data.ok) throw new Error(data.message);
                    alert('반려 처리되었습니다.');
                    loadReports();
                } catch (e) {
                    alert('반려 처리 중 오류가 발생했습니다: ' + e.message);
                    console.error(e);
                }
            };

            if (isLoading) return (
                <div className="flex flex-col items-center justify-center py-24 gap-4">
                    <i className="fas fa-spinner fa-spin text-robogram-blue text-4xl"></i>
                    <p className="text-gray-500 font-bold">LMS에서 보고서를 불러오는 중...</p>
                </div>
            );

            return (
                <div className="fade-in">
                    <header className="mb-8">
                        <div className="bg-white/70 backdrop-blur-md p-6 rounded-3xl border border-white shadow-sm inline-block">
                            <h2 className="text-3xl font-black text-gray-800 flex items-center gap-3">
                                <i className="fas fa-clipboard-check text-robogram-blue"></i>
                                보고서 승인 관리
                                {lmsReports.length > 0 && (
                                    <span className="bg-red-500 text-white text-base font-black px-3 py-1 rounded-full">{lmsReports.length}</span>
                                )}
                            </h2>
                            <p className="text-gray-600 font-bold mt-2 break-keep">LMS에서 강사가 제출한 수업보고서를 검토하고 승인합니다. 승인 시 학교 선생님이 열람할 수 있습니다.</p>
                        </div>
                        <button onClick={loadReports} className="ml-3 px-4 py-2.5 bg-white/80 border border-white rounded-xl text-gray-600 font-bold hover:bg-white transition-all shadow-sm text-sm">
                            <i className="fas fa-sync-alt mr-1"></i> 새로고침
                        </button>
                    </header>

                    {error && (
                        <div className="bg-red-50 border border-red-200 rounded-2xl p-5 mb-6 text-red-700 font-bold flex items-center gap-3">
                            <i className="fas fa-exclamation-triangle text-xl"></i>
                            <span>{error}</span>
                        </div>
                    )}

                    {lmsReports.length === 0 && !error ? (
                        <div className="bg-white/85 backdrop-blur-xl rounded-[2rem] border border-white/60 shadow-xl p-16 text-center">
                            <div className="w-24 h-24 bg-green-50 border border-green-100 rounded-full flex items-center justify-center mx-auto mb-6 shadow-sm">
                                <i className="fas fa-check-double text-5xl text-green-500"></i>
                            </div>
                            <h3 className="text-2xl font-black text-gray-800 mb-2">승인 대기 보고서가 없습니다</h3>
                            <p className="text-gray-500 font-bold break-keep">강사가 LMS에서 보고서를 제출하면 이 곳에 표시됩니다.</p>
                        </div>
                    ) : (
                        <div className="space-y-4">
                            {lmsReports.map(report => {
                                const key = report.wr_id;
                                const isExpanded = expandedId === key;
                                const isApproving = approvingId === key;
                                return (
                                    <div key={key} className="bg-white/90 backdrop-blur-xl rounded-2xl border-2 border-amber-200 shadow-lg overflow-hidden transition-all">
                                        {/* 헤더 영역 */}
                                        <div className="p-6 flex flex-col md:flex-row md:items-center gap-4">
                                            <div className="flex-1">
                                                <div className="flex flex-wrap items-center gap-2 mb-2">
                                                    <span className="bg-amber-100 text-amber-700 text-sm font-black px-3 py-1 rounded-full border border-amber-200">
                                                        <i className="fas fa-clock mr-1"></i> 승인 대기중
                                                    </span>
                                                    <span className="bg-robogram-blue/10 text-robogram-blue text-sm font-black px-3 py-1 rounded-full">
                                                        {report.chasi}
                                                    </span>
                                                </div>
                                                <h3 className="text-xl font-black text-gray-800 break-keep">
                                                    {report.school}
                                                </h3>
                                                <p className="text-gray-500 font-bold text-sm mt-1">
                                                    <i className="fas fa-user-tie mr-1"></i> 강사: {report.author || '미지정'}
                                                    <span className="ml-3">
                                                        <i className="far fa-clock mr-1"></i>
                                                        {report.created ? new Date(report.created).toLocaleString('ko-KR') : ''}
                                                    </span>
                                                </p>
                                            </div>
                                            <div className="flex gap-2 shrink-0 flex-wrap">
                                                <button
                                                    onClick={() => setExpandedId(isExpanded ? null : key)}
                                                    className="px-4 py-2.5 rounded-xl font-bold text-sm bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 transition-all shadow-sm"
                                                >
                                                    <i className={`fas fa-chevron-${isExpanded ? 'up' : 'down'} mr-1`}></i>
                                                    {isExpanded ? '접기' : '내용 확인'}
                                                </button>
                                                {report.viewUrl && (
                                                    <a href={report.viewUrl} target="_blank" rel="noreferrer"
                                                        className="px-4 py-2.5 rounded-xl font-bold text-sm bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 transition-all shadow-sm flex items-center gap-1">
                                                        <i className="fas fa-external-link-alt"></i> LMS 보기
                                                    </a>
                                                )}
                                                <button
                                                    onClick={() => handleReject(report)}
                                                    className="px-4 py-2.5 rounded-xl font-bold text-sm bg-red-50 border border-red-200 text-red-600 hover:bg-red-100 transition-all shadow-sm"
                                                >
                                                    <i className="fas fa-times mr-1"></i> 반려
                                                </button>
                                                <button
                                                    onClick={() => handleApprove(report)}
                                                    disabled={isApproving}
                                                    className="px-6 py-2.5 rounded-xl font-black text-sm bg-robogram-blue text-white hover:bg-robogram-lightBlue transition-all shadow-md disabled:opacity-60 flex items-center gap-2"
                                                >
                                                    {isApproving ? (
                                                        <><i className="fas fa-spinner fa-spin"></i> 승인 중...</>
                                                    ) : (
                                                        <><i className="fas fa-check"></i> 승인하기</>
                                                    )}
                                                </button>
                                            </div>
                                        </div>

                                        {/* 내용 확인 영역 (토글) */}
                                        {isExpanded && (
                                            <div className="border-t border-amber-100 bg-amber-50/50 p-6 space-y-4 fade-in">
                                                {report.content && (
                                                    <div>
                                                        <p className="text-xs font-black text-gray-500 uppercase tracking-wider mb-2"><i className="fas fa-edit mr-1"></i>주요 수업 내용</p>
                                                        <p className="text-gray-800 font-medium leading-relaxed bg-white p-4 rounded-xl border border-white shadow-sm whitespace-pre-wrap break-keep">{report.content}</p>
                                                    </div>
                                                )}
                                                {report.notes && (
                                                    <div>
                                                        <p className="text-xs font-black text-gray-500 uppercase tracking-wider mb-2"><i className="fas fa-comment-dots mr-1"></i>특이사항 및 강사의견</p>
                                                        <p className="text-gray-800 font-medium leading-relaxed bg-white p-4 rounded-xl border border-white shadow-sm whitespace-pre-wrap break-keep">{report.notes}</p>
                                                    </div>
                                                )}
                                                {report.photoUrl && (
                                                    <div>
                                                        <p className="text-xs font-black text-gray-500 uppercase tracking-wider mb-2"><i className="fas fa-camera mr-1"></i>현장 사진</p>
                                                        <img src={report.photoUrl} alt="현장사진" className="rounded-xl border border-white shadow-md max-h-64 object-contain" />
                                                    </div>
                                                )}
                                                {!report.content && !report.notes && !report.photoUrl && (
                                                    <p className="text-gray-400 font-bold text-center py-4">보고서 내용이 없습니다.</p>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        }


        // --- 앱 렌더링 ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
