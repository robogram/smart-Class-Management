<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로보그램 스마트 수업관리</title>
    
    <!-- Tailwind CSS (디자인용) - 커스텀 컬러 설정 포함 -->

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        robogram: {
                            blue: '#0044CC', // 로고의 진한 파란색
                            lightBlue: '#3377FF', // 로고의 밝은 파란색
                            orange: '#FF9900', // 포인트 오렌지
                            yellow: '#FFCC00', // 포인트 옐로우
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome (아이콘용) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & Babel (앱 동작용) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        Babel.registerPreset('custom-react', {
            presets: [
                [Babel.availablePresets['react'], { runtime: 'classic' }]
            ]
        });
    </script>

    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* 스크롤바 디자인 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-white text-gray-800 font-sans break-keep">
    <div id="root"></div>

    <script type="text/babel" data-type="module" data-presets="custom-react">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, updateDoc, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const { useState, useEffect, useRef } = React;

        // --- Firebase 초기화 설정 ---
        const firebaseConfig = {
            apiKey: "AIzaSyBB4lcFbNcRBPrucUFQp0l2qHcXdWF_UUQ",
            authDomain: "edusync-app-2a5f5.firebaseapp.com",
            projectId: "edusync-app-2a5f5",
            storageBucket: "edusync-app-2a5f5.firebasestorage.app",
            messagingSenderId: "945682920335",
            appId: "1:945682920335:web:8b11a8d2a2731a603711fa"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = firebaseConfig.projectId;

        // --- [학교명 정규화 및 유연한 일치 판별 유틸리티] ---
        // 띄어쓰기(공백) 유무, '고등학교'/'고', '중학교'/'중', '초등학교'/'초', '여자'/'여' 표기 차이를 유연하게 자동 감지
        function normalizeSchoolName(str) {
            if (!str) return '';
            return String(str).replace(/\s+/g, '').toLowerCase();
        }

        function isSchoolMatch(schoolA, schoolB) {
            const a = normalizeSchoolName(schoolA);
            const b = normalizeSchoolName(schoolB);
            if (!a || !b) return false;
            if (a === b) return true;

            const simplify = (s) => s
                .replace(/여자/g, '여')
                .replace(/고등학교$/, '고')
                .replace(/중학교$/, '중')
                .replace(/초등학교$/, '초');

            const simpA = simplify(a);
            const simpB = simplify(b);
            if (simpA === simpB) return true;

            if (Math.min(a.length, b.length) >= 2) {
                if (a.includes(b) || b.includes(a) || simpA.includes(simpB) || simpB.includes(simpA)) {
                    return true;
                }
            }
            return false;
        }

        // --- [Main App Component] ---
        function App() {
            const [fbUser, setFbUser] = useState(null);       
            const [user, setUser] = useState(null);           
            
            const [currentView, setCurrentView] = useState('login');
            const [activeDoc, setActiveDoc] = useState(null);
            const [activeSessionId, setActiveSessionId] = useState(null);
            const [viewingFile, setViewingFile] = useState(null);
            const [isLoading, setIsLoading] = useState(true);

            const [classes, setClasses] = useState([
                { 
                    id: 1, 
                    name: '창의융합 코딩교실', 
                    school: '서울초등학교', 
                    teacher: '이선생', 
                    teacherEmail: 'lee@school.edu', 
                    instructor: '홍길동', 
                    instructorEmail: 'hong@school.edu', 
                    schedule: [
                        { id: 101, label: '1일차', sessions: 2 },
                        { id: 102, label: '2일차', sessions: 2 },
                        { id: 103, label: '3일차', sessions: 3 },
                        { id: 104, label: '4일차', sessions: 3 }
                    ],
                    materials: [],
                    reports: [], 
                    instructorSubmitted: false, 
                    isFinalSubmitted: false 
                }
            ]);

            const myClasses = user && user.role !== 'admin' ? classes.filter(c => {
                if (!isSchoolMatch(c.school, user.school)) return false;
                if (user.role === 'teacher') {
                    return c.teacher === user.name && c.teacherEmail === user.email;
                } else if (user.role === 'instructor') {
                    return c.instructor === user.name && c.instructorEmail === user.email;
                }
                return false;
            }) : [];

            const handleClassChange = async (newClassId) => {
                const updatedUser = { ...user, selectedClassId: newClassId };
                setUser(updatedUser);
                if (fbUser) {
                    try {
                        const profileRef = doc(db, 'artifacts', appId, 'users', fbUser.uid, 'profile', 'data');
                        await updateDoc(profileRef, { selectedClassId: newClassId });
                    } catch (e) {
                        console.error("수업 전환 동기화 에러:", e);
                    }
                }
            };

            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            try {
                                await signInWithCustomToken(auth, __initial_auth_token);
                            } catch (customTokenError) {
                                console.warn("개인 Firebase 설정 감지됨 (커스텀 토큰 불일치). 익명 로그인으로 자동 전환합니다.", customTokenError);
                                await signInAnonymously(auth);
                            }
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.error("인증 에러 (로컬 임시 모드 전환):", error);
                        setIsLoading(false); 
                    }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, async (authUser) => {
                    setFbUser(authUser);
                    if (authUser) {
                        try {
                            const profileRef = doc(db, 'artifacts', appId, 'users', authUser.uid, 'profile', 'data');
                            const profileSnap = await getDoc(profileRef);
                            if (profileSnap.exists()) {
                                const profileData = profileSnap.data();
                                setUser(profileData);
                                setCurrentView(profileData.role === 'admin' ? 'admin' : 'dashboard');
                            }
                        } catch(e) {
                            console.error("프로필 로드 에러:", e);
                        }
                    } else {
                        setUser(null);
                    }
                    setIsLoading(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (!fbUser) return;
                try {
                    const classesRef = collection(db, 'artifacts', appId, 'public', 'data', 'classes');
                    const unsubscribe = onSnapshot(classesRef, (snapshot) => {
                        const fetchedClasses = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setClasses(fetchedClasses);
                    }, (error) => {
                        console.error("수업 목록 로드 에러:", error);
                    });
                    return () => unsubscribe();
                } catch(e) {
                    console.error("스냅샷 에러:", e);
                }
            }, [fbUser]);

            const addClass = async (newClassData) => {
                if (!fbUser) {
                    const newId = Date.now().toString();
                    setClasses([...classes, { id: newId, ...newClassData }]);
                    alert('[로컬 테스트 모드] 새 수업이 생성되었습니다. (새로고침 시 사라집니다)');
                    return;
                }
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'classes'), newClassData);
                    alert('새 수업이 성공적으로 생성되었습니다.');
                } catch (e) { alert('수업 생성에 실패했습니다.'); console.error(e); }
            };

            const updateClass = async (classId, updatedFields) => {
                if (!fbUser) {
                    setClasses(classes.map(c => c.id === classId ? { ...c, ...updatedFields } : c));
                    return;
                }
                try {
                    await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'classes', classId), updatedFields);
                    
                    // 만약 materials(계획서/만족도조사 첨부파일) 정보가 변경된 경우, 그누보드 LMS 서버와 실시간 웹훅 동기화
                    if (updatedFields.materials !== undefined) {
                        const targetClass = classes.find(c => c.id === classId);
                        if (targetClass) {
                            fetch('./sync_to_lms.php', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    action: 'sync_materials',
                                    school: targetClass.school,
                                    instructorEmail: targetClass.instructorEmail,
                                    materials: updatedFields.materials
                                })
                            })
                            .then(res => res.json())
                            .then(resData => {
                                console.log("LMS 최종문서 실시간 동기화 응답:", resData);
                            })
                            .catch(err => {
                                console.error("LMS 최종문서 실시간 동기화 네트워크 에러:", err);
                            });
                        }
                    }
                } catch (e) { 
                    const errorMsg = e.message || e.toString();
                    if (errorMsg.includes("exceeds the maximum allowed size")) {
                        if (confirm("⚠️ [용량 초과 긴급 복구 자동 감지]\n\nFirestore DB의 단일 문서 저장 용량(1MB)을 초과하여 저장이 실패했습니다.\n\n이 문제를 해결하려면 기존 차시의 현장사진 데이터를 비워 용량을 확보해야 합니다. (수업내용 텍스트는 안전하게 유지됩니다.)\n\n기존 사진 데이터를 모두 비우고 정상 저장 상태로 자동 복구하시겠습니까?\n(확인을 누르시면 용량이 복구되며, 이후 각 차시의 사진들을 17KB 수준의 파일들로 다시 첨부해 주시면 정상 저장됩니다.)")) {
                            try {
                                const targetClass = classes.find(c => c.id === classId);
                                if (targetClass) {
                                    const cleanedReports = (targetClass.reports || []).map(r => {
                                        return { ...r, photoUploaded: false, photoData: null };
                                    });
                                    const classDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'classes', classId);
                                    await setDoc(classDocRef, { ...targetClass, reports: cleanedReports });
                                    alert("✅ 저장 용량이 성공적으로 복구되었습니다!\n\n이제 정상적으로 저장 및 작성이 가능합니다. 각 차시별 사진을 다시 등록해 주세요.");
                                    window.location.reload();
                                    return;
                                }
                            } catch (err) {
                                alert("자동 복구 실패: " + err.message);
                            }
                        }
                    }
                    alert('업데이트 실패: ' + errorMsg); 
                    console.error(e); 
                }
            };
			// [추가] 클라우드 DB에서 수업 전체를 완전히 삭제하는 함수
            const deleteClass = async (classId) => {
                if (!fbUser) {
                    setClasses(classes.filter(c => c.id !== classId));
                    return;
                }
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'classes', classId));
                    alert('수업이 안전하게 삭제되었습니다.');
                } catch (e) { alert('수업 삭제에 실패했습니다.'); console.error(e); }
            };

            // --- 🚨 [일회성 데이터 긴급 복구 마이그레이션 로직] ---
            useEffect(() => {
                const hasRun = localStorage.getItem('edusync_migration_yeoju_done');
                if (hasRun === 'true') return; // [초고속 방어벽] 동기 영역에서 0ms 만에 즉시 탈출하여 무한 루프 원천 차단
                
                if (classes.length === 0 || !fbUser) return;
                
                const runEmergencyMigration = async () => {
                    try {
                        // 1. 잘못 적힌 여주제일고 잼S 메타버스 코딩캠프 (임상희 강사) 수업 찾기
                        const sourceClass = classes.find(c => c.school === '여주제일고등학교' && c.name.includes('잼S'));
                        // 2. 원래 저장되어야 할 여주제일고 로보미 아바타 AI 코딩캠프 (김나경 강사) 수업 찾기
                        const targetClass = classes.find(c => c.school === '여주제일고등학교' && c.name.includes('로보미'));
                        
                        if (sourceClass && targetClass) {
                            // 잼S(임상희)에 잘못 저장된 1, 2, 3차시 보고서 필터링
                            const sourceReports = sourceClass.reports || [];
                            const reportsToMove = sourceReports.filter(r => r.id === 1 || r.id === 2 || r.id === 3);
                            
                            if (reportsToMove.length > 0) {
                                // 대상 수업(로보미 - 김나경)의 기존 보고서들과 병합 (1,2,3차시는 잼S에서 가져온 것으로 교체)
                                const targetReports = targetClass.reports || [];
                                const otherTargetReports = targetReports.filter(r => r.id !== 1 && r.id !== 2 && r.id !== 3);
                                const newTargetReports = [...otherTargetReports, ...reportsToMove].sort((a, b) => a.id - b.id);
                                
                                // 원본 수업(잼S - 임상희)에서는 1, 2, 3차시 보고서 비우기
                                const newSourceReports = sourceReports.filter(r => r.id !== 1 && r.id !== 2 && r.id !== 3);
                                
                                // [선제 잠금] Firestore 비동기 쓰기 전에 로컬 스토리지를 즉시 선점하여 복사 진행 중 발생하는 스냅샷 트리거 무한 루프 원천 격리
                                localStorage.setItem('edusync_migration_yeoju_done', 'true');
                                
                                // Firestore 동기화
                                await updateClass(targetClass.id, { reports: newTargetReports });
                                await updateClass(sourceClass.id, { reports: newSourceReports });
                                
                                console.log("🎉 여주제일고등학교 데이터 마이그레이션 복구가 성공적으로 완료되었습니다!");
                                alert("🚨 [시스템 긴급 복구 안내]\n\n여주제일고등학교 데이터 오발송 건(임상희 강사 -> 김나경 강사 보고서)의 데이터 마이그레이션 및 동기화 처리가 안전하게 완료되었습니다.");
                            } else {
                                // 이동할 데이터가 이미 처리되어 없는 경우도 차단막 잠금
                                localStorage.setItem('edusync_migration_yeoju_done', 'true');
                            }
                        }
                    } catch (err) {
                        console.error("데이터 긴급 마이그레이션 실패:", err);
                    }
                };
                
                runEmergencyMigration();
            }, [classes, fbUser]);

            const handleLogin = async (formData) => {
                if (formData.role === 'admin') {
                    try {
                        const userCredential = await signInWithEmailAndPassword(auth, formData.email, formData.password);
                        const profileRef = doc(db, 'artifacts', appId, 'users', userCredential.user.uid, 'profile', 'data');
                        const adminProfile = { role: 'admin', name: '최고관리자', school: '통합관리시스템', email: formData.email };
                        await setDoc(profileRef, adminProfile);
                        
                        setUser(adminProfile);
                        setCurrentView('admin');
                        return;
                    } catch (error) {
                        console.error("관리자 인증 실패:", error);
                        alert('관리자 계정 정보가 일치하지 않습니다.\nFirebase에 등록된 이메일과 비밀번호를 확인해주세요.');
                        return; 
                    }
                }

                const hasAccess = classes.some(c => {
                    if (!isSchoolMatch(c.school, formData.school)) return false;
                    if (formData.role === 'teacher') {
                        return c.teacher === formData.name && c.teacherEmail === formData.email;
                    } else if (formData.role === 'instructor') {
                        return c.instructor === formData.name && c.instructorEmail === formData.email;
                    }
                    return false;
                });

                if (!hasAccess) {
                    alert('입력하신 정보(학교명/성함/이메일)가 관리자가 등록한 수업 정보와 일치하지 않습니다.\n등록 여부를 확인해주세요.');
                    return;
                }

                let finalFormData = { ...formData };
                if (!finalFormData.selectedClassId) {
                    const firstMatch = classes.find(c => {
                        if (!isSchoolMatch(c.school, formData.school)) return false;
                        if (formData.role === 'teacher') {
                            return c.teacher === formData.name && c.teacherEmail === formData.email;
                        } else if (formData.role === 'instructor') {
                            return c.instructor === formData.name && c.instructorEmail === formData.email;
                        }
                        return false;
                    });
                    if (firstMatch) {
                        finalFormData.selectedClassId = firstMatch.id;
                        finalFormData.school = firstMatch.school; // DB의 정식 학교명으로 일치시킴
                    }
                } else {
                    const selectedClass = classes.find(c => c.id === finalFormData.selectedClassId);
                    if (selectedClass) {
                        finalFormData.school = selectedClass.school;
                    }
                }

                if (!fbUser) {
                    setUser(finalFormData);
                    setCurrentView('dashboard');
                    return;
                }
                try {
                    const profileRef = doc(db, 'artifacts', appId, 'users', fbUser.uid, 'profile', 'data');
                    await setDoc(profileRef, finalFormData);
                    setUser(finalFormData);
                    setCurrentView('dashboard');
                } catch(e) {
                    alert('로그인 처리 중 오류가 발생했습니다.');
                    console.error(e);
                }
            };

            const handleLogout = () => {
                setUser(null);
                setCurrentView('login');
            };

            const navigateTo = (view, doc = null, sessionId = null) => {
                setCurrentView(view);
                if (doc) setActiveDoc(doc);
                if (sessionId) setActiveSessionId(sessionId);
            };

            if (isLoading) return (
                <div className="min-h-screen bg-white flex items-center justify-center flex-col gap-4">
                    <i className="fas fa-spinner fa-spin text-robogram-blue text-4xl"></i>
                    <p className="text-gray-500 font-medium">시스템 준비 중...</p>
                </div>
            );

            if (!user) return <LoginScreen onLogin={handleLogin} classes={classes} />;

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-slate-50 relative overflow-hidden">
                    <div 
                        className="fixed inset-0 z-0 pointer-events-none"
                        style={{
                            backgroundImage: "url('Gemini_Generated_Image_9aloni9aloni9alo.jpg')",
                            backgroundSize: 'cover',
                            backgroundPosition: 'center',
                            backgroundAttachment: 'fixed',
                            opacity: 1 
                        }}
                    />

                    <aside className="w-full md:w-64 bg-white/70 backdrop-blur-2xl border-r border-white/60 shadow-[4px_0_24px_rgba(0,0,0,0.05)] flex flex-col z-30 shrink-0 relative">
                        <div className="p-6 flex items-center gap-3 border-b border-white/50">
                            <img src="로보그램 로고.png" alt="로보그램 로고" className="h-8 w-auto bg-white rounded-md p-1 shadow-sm border border-gray-100" />
                            <div>
                                <h1 className="text-lg font-black tracking-tight text-robogram-blue">ROBOGRAM</h1>
                                <p className="text-[11px] font-bold text-gray-500">스마트 수업관리</p>
                            </div>
                        </div>
                        
                        <div className="p-6 flex-1">
                            <div className="mb-6">
                                <p className="text-xs text-gray-400 font-bold mb-2">내 정보</p>

                    text: text,
                    date: new Date().toLocaleTimeString(),
                    read: false
                };
                setNotifications(prev => [newNoti, ...prev]);
            };

            const prevClassesRef = useRef(classes);
            useEffect(() => {
                classes.forEach(c => {
                    const prevC = prevClassesRef.current.find(pc => pc.id === c.id);
                    if (prevC) {
                        if (c.instructorSubmitted && !prevC.instructorSubmitted) {
                            handleAddNotification(`✍️ [강사 제출] '${c.school} | ${c.name}' 수업 보고서가 강사에 의해 최종 제출되었습니다.`);
                        }
                        const totalPrevComments = prevC.reports?.reduce((acc, r) => acc + (r.comments?.length || 0), 0) || 0;
                        const totalCurrComments = c.reports?.reduce((acc, r) => acc + (r.comments?.length || 0), 0) || 0;
                        if (totalCurrComments > totalPrevComments) {
                            handleAddNotification(`💬 [새 댓글] '${c.school} | ${c.name}' 수업 보고서에 새로운 소통 피드백이 달렸습니다.`);
                        }
                    }
                });
                prevClassesRef.current = classes;
            }, [classes]);

            useEffect(() => {
                if (classes.length > 0 && !classes.find(c => c.id === activeClassId)) {
                    setActiveClassId(classes[0].id);
                }
            }, [classes, activeClassId]);

            const activeClass = classes.find(c => c.id === activeClassId);

            const handleAddSchedule = () => setNewClass({ ...newClass, schedule: [...newClass.schedule, { id: Date.now(), label: `${newClass.schedule.length + 1}일차`, sessions: 2 }] });
            const handleRemoveSchedule = (id) => setNewClass({ ...newClass, schedule: newClass.schedule.filter(s => s.id !== id) });
            const handleScheduleChange = (id, field, value) => setNewClass({ ...newClass, schedule: newClass.schedule.map(s => s.id === id ? { ...s, [field]: value } : s) });

            const newClassTotalDays = newClass.schedule.length;
            const newClassTotalSessions = newClass.schedule.reduce((acc, curr) => acc + (parseInt(curr.sessions) || 0), 0);

            const handleCreateSubmit = (e) => {
                e.preventDefault();
                if (!newClass.name || !newClass.school || !newClass.teacher || !newClass.teacherEmail || !newClass.instructor || !newClass.instructorEmail) {
                    return alert('수업명, 학교명 및 교사/강사 정보(이름, 이메일)를 모두 입력해주세요.');

                const newClassData = { ...newClass, materials: [], reports: [], instructorSubmitted: false, isFinalSubmitted: false };
                addClass(newClassData);
                
                setIsCreating(false);
                setNewClass({ name: '', school: '', teacher: '', teacherEmail: '', instructor: '', instructorEmail: '', schedule: [{ id: Date.now(), label: '1일차', sessions: 2 }] });
                handleAddNotification(`🆕 [수업 생성] '${newClass.school} | ${newClass.name}' 수업 정보가 성공적으로 새롭게 개설되었습니다.`);
            };

            const startEditingClass = () => {
                setEditingClassId(activeClass.id);
                setEditClassData({
                    school: activeClass.school || '',
                    name: activeClass.name || '',
                    teacher: activeClass.teacher || '', teacherEmail: activeClass.teacherEmail || '',
                    instructor: activeClass.instructor || '', instructorEmail: activeClass.instructorEmail || '',
                    schedule: activeClass.schedule ? JSON.parse(JSON.stringify(activeClass.schedule)) : []
                });
            };

            const saveEditingClass = () => {
                updateClass(activeClass.id, { 
                    school: editClassData.school,
                    name: editClassData.name,
                    teacher: editClassData.teacher, teacherEmail: editClassData.teacherEmail,
                    instructor: editClassData.instructor, instructorEmail: editClassData.instructorEmail, schedule: editClassData.schedule 
                });
                setEditingClassId(null);
                alert('해당 수업의 설정 정보가 성공적으로 수정/동기화되었습니다.');
                handleAddNotification(`⚙️ [설정 변경] '${editClassData.school} | ${editClassData.name}' 수업 설정 정보가 수정되었습니다.`);

            const handleAddEditSchedule = () => setEditClassData({...editClassData, schedule: [...editClassData.schedule, { id: Date.now(), label: `${editClassData.schedule.length + 1}일차`, sessions: 1 }]});
            const handleRemoveEditSchedule = (id) => setEditClassData({...editClassData, schedule: editClassData.schedule.filter(s => s.id !== id)});
            const handleEditScheduleChange = (id, field, value) => setEditClassData({...editClassData, schedule: editClassData.schedule.map(s => s.id === id ? { ...s, [field]: value } : s)});

            const activeClassTotalDays = activeClass?.schedule?.length || 0;
            const activeClassTotalSessions = activeClass?.schedule?.reduce((acc, curr) => acc + (parseInt(curr.sessions) || 0), 0) || 0;

            const handleFileUpload = (e, docType) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const fileContent = event.target.result;
                    const newMaterial = { 
                        name: file.name, type: docType, date: new Date().toLocaleDateString(),
                        content: (file.name.toLowerCase().endsWith('.html') || file.name.toLowerCase().endsWith('.pdf')) ? fileContent : null 
                    };
                    const existingMaterials = activeClass.materials || [];
                    const otherMaterials = existingMaterials.filter(m => !(m.type === docType && m.name === file.name));
                    updateClass(activeClass.id, { materials: [...otherMaterials, newMaterial] });
                    alert(`[${activeClass.name}] ${docType}에 '${file.name}' 파일이 업로드되었습니다.`);
                    handleAddNotification(`📁 [문서 업로드] '${activeClass.school} | ${activeClass.name}' 수업에 '${docType}'가 업로드되었습니다.`);
                };

                if (file.name.toLowerCase().endsWith('.html')) {
                    reader.readAsText(file);
                } else if (file.name.toLowerCase().endsWith('.pdf')) {
                    reader.readAsDataURL(file);
                } else {
                    const newMaterial = { name: file.name, type: docType, date: new Date().toLocaleDateString(), content: null };
                    const existingMaterials = activeClass.materials || [];
                    const otherMaterials = existingMaterials.filter(m => !(m.type === docType && m.name === file.name));
                    updateClass(activeClass.id, { materials: [...otherMaterials, newMaterial] });
                    alert(`[${activeClass.name}] ${docType}에 '${file.name}' 파일이 업로드되었습니다.`);
                }
                e.target.value = null;
            };

            const handleDeleteMaterial = (materialIndex) => {
                if (window.confirm('정말 이 자료를 삭제하시겠습니까?')) {
                    const targetMaterial = activeClass.materials[materialIndex];
                    const updatedMaterials = activeClass.materials.filter((_, idx) => idx !== materialIndex);
                    updateClass(activeClass.id, { materials: updatedMaterials });
                    handleAddNotification(`🗑️ [문서 삭제] '${activeClass.school} | ${activeClass.name}' 수업에서 '${targetMaterial.type}' 문서가 삭제되었습니다.`);
                }
            };

            const handleBulkFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const fileContent = event.target.result;
                    setBulkFile({
                        name: file.name,
                        content: (file.name.toLowerCase().endsWith('.html') || file.name.toLowerCase().endsWith('.pdf')) ? fileContent : null
                    });
                };
                if (file.name.toLowerCase().endsWith('.html')) {
                    reader.readAsText(file);
                } else if (file.name.toLowerCase().endsWith('.pdf')) {
                    reader.readAsDataURL(file);
                } else {
                    setBulkFile({ name: file.name, content: null });
                }
            };

            const triggerBulkUpload = async () => {
                if (!bulkFile) return alert('배포할 파일을 첨부해 주세요.');
                if (selectedClassIdsForBulk.length === 0) return alert('배포할 대상 수업을 최소 1개 이상 선택해 주세요.');

                if (window.confirm(`선택한 ${selectedClassIdsForBulk.length}개의 수업에 '${bulkDocType}' 문서를 일괄 배포하시겠습니까?`)) {
                    for (const cid of selectedClassIdsForBulk) {
                        const targetClass = classes.find(c => c.id === cid);

                            const newMaterial = {
                                name: bulkFile.name,
                                type: bulkDocType,
                                date: new Date().toLocaleDateString(),
                                content: bulkFile.content

                            const existingMaterials = targetClass.materials || [];
                            const otherMaterials = existingMaterials.filter(m => !(m.type === bulkDocType && m.name === bulkFile.name));

                    handleAddNotification(`📂 '${bulkDocType}' 문서가 ${selectedClassIdsForBulk.length}개 수업에 일괄 배포되었습니다.`);
                    alert('문서 일괄 배포가 성공적으로 완료되었습니다!');
                    setIsBulking(false);
                    setBulkFile(null);
                    setSelectedClassIdsForBulk([]);

                const schoolNoSpace = c.school ? c.school.replace(/\s+/g, '').toLowerCase() : '';
                const nameNoSpace = c.name ? c.name.replace(/\s+/g, '').toLowerCase() : '';
                const matchesSearch = !searchQuery || 
                    c.school.toLowerCase().includes(q) || 
                    schoolNoSpace.includes(qNoSpace) ||
                    c.name.toLowerCase().includes(q) ||
                    nameNoSpace.includes(qNoSpace) ||
                    (c.teacher && c.teacher.toLowerCase().includes(q)) ||
                    (c.instructor && c.instructor.toLowerCase().includes(q));
                return matchesSchool && matchesSearch;
            });

            const totalSchoolsCount = new Set(classes.map(c => c.school).filter(Boolean)).size;
            const totalClassesCount = classes.length;

            let uploadedDocsCount = 0;
            const totalExpectedDocs = classes.length * 3;
            classes.forEach(c => {
                const matTypes = (c.materials || []).map(m => m.type);
                if (matTypes.includes('수업운영 계획서')) uploadedDocsCount++;
                if (matTypes.includes('수업성취도 보고서')) uploadedDocsCount++;
                if (matTypes.includes('학생만족도 보고서') || matTypes.includes('만족도 조사 보고서')) uploadedDocsCount++;
            });
            const documentProgressRate = totalExpectedDocs > 0 ? Math.round((uploadedDocsCount / totalExpectedDocs) * 100) : 0;

            const unreadCount = notifications.filter(n => !n.read).length;
            const markAllAsRead = () => {
                setNotifications(notifications.map(n => ({ ...n, read: true })));
            };

            return (
                <div className="fade-in space-y-6">
                    <header className="bg-white/70 backdrop-blur-xl p-6 rounded-[2rem] border border-white/60 shadow-lg flex flex-col md:flex-row justify-between items-end gap-4 relative z-50">
                        <div>
                            <h2 className="text-3xl font-black text-gray-800 drop-shadow-sm flex items-center gap-3">
                                <span>통합 관리자 센터</span>
                                <span className="text-xs bg-robogram-blue text-white px-3 py-1.5 rounded-full font-bold shadow-sm">Real-time DB Sync</span>
                            </h2>
                            <p className="text-gray-700 font-bold mt-1.5 break-keep">전체 학교 및 수업에 배포된 최종 문서와 수업 일정을 통제하고 실시간으로 관리합니다.</p>
                        </div>
                        <div className="flex items-center gap-3 w-full md:w-auto">
                            <div className="relative">
                                <button 
                                    onClick={() => { setIsNotiOpen(!isNotiOpen); markAllAsRead(); }}
                                    className="w-12 h-12 rounded-xl bg-white shadow-sm border border-gray-100 text-gray-600 hover:text-robogram-blue hover:shadow-md transition-all flex items-center justify-center relative"
                                >
                                    <i className="fas fa-bell text-lg"></i>
                                    {unreadCount > 0 && (
                                        <span className="absolute -top-1.5 -right-1.5 bg-red-500 text-white font-black text-[10px] w-5 h-5 rounded-full flex items-center justify-center animate-bounce shadow-sm">
                                            {unreadCount}
                                        </span>
                                    )}
                                </button>
                                
                                {isNotiOpen && (
                                    <div className="absolute right-0 mt-3 bg-white rounded-2xl shadow-2xl border border-gray-100 w-80 p-4 z-[999] fade-in max-h-96 overflow-y-auto">
                                        <div className="flex justify-between items-center border-b border-gray-100 pb-2 mb-3">
                                            <h4 className="font-black text-sm text-gray-800"><i className="fas fa-satellite-dish text-robogram-blue mr-1.5"></i> EduSync 실시간 소식</h4>
                                            <button onClick={() => setNotifications([])} className="text-[10px] text-gray-400 hover:text-red-500 font-bold">전체 삭제</button>
                                        </div>
                                        <div className="space-y-3">
                                            {notifications.length > 0 ? (
                                                notifications.map(n => (
                                                    <div key={n.id} className="text-xs bg-slate-50 border border-slate-100 p-2.5 rounded-xl flex flex-col gap-1 text-gray-700 font-medium">
                                                        <p className="leading-relaxed break-keep">{n.text}</p>
                                                        <span className="text-[9px] text-gray-400 self-end font-bold">{n.date}</span>
                                                    </div>
                                                ))
                                            ) : (
                                                <p className="text-xs text-gray-400 text-center py-6 font-bold">수신된 실시간 알림이 없습니다.</p>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>

                            <button 
                                onClick={() => setIsBulking(true)} 
                                className="bg-indigo-600 hover:bg-indigo-700 text-white font-black px-5 py-3.5 rounded-xl shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2 text-sm md:text-base flex-1 md:flex-none"
                            >
                                <i className="fas fa-mail-bulk"></i> 일괄 문서 배포
                            </button>

                            <button 
                                onClick={() => setIsCreating(true)} 
                                className="bg-robogram-blue hover:bg-robogram-lightBlue active:bg-blue-800 text-white font-black px-5 py-3.5 rounded-xl shadow-lg hover:shadow-xl transition-all flex items-center justify-center gap-2 text-sm md:text-base flex-1 md:flex-none shrink-0"
                            >
                                <i className="fas fa-plus"></i> 새 수업 정보 생성
                            </button>
                        </div>
                    </header>

                    {isBulking && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/75 backdrop-blur-md p-4 fade-in">

                                </div>

                                            <select

                                            >
                                                <option value="수업운영 계획서">수업운영 계획서</option>
                                                <option value="수업성취도 보고서">수업성취도 보고서</option>
                                                <option value="학생만족도 보고서">학생만족도 보고서</option>
                                            </select>

                                                            className="w-4 h-4 accent-indigo-600 rounded"
                                                        />
                                                        <span className="truncate pr-2">{c.school} | {c.name}</span>

                    {isCreating ? (

                            <form onSubmit={handleCreateSubmit} className="space-y-6">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-2">수업 매칭 정보</label>
                                        <input required type="text" placeholder="수업명 (예: 창의융합 코딩교실)" className="w-full px-5 py-4 rounded-xl border border-white bg-white/80 focus:bg-white focus:border-robogram-blue outline-none transition-all font-bold text-gray-900 shadow-sm mb-4" value={newClass.name} onChange={e => setNewClass({ ...newClass, name: e.target.value })} />
                                        <input required type="text" placeholder="대상 학교명 (예: 서울초등학교)" className="w-full px-5 py-4 rounded-xl border border-white bg-white/80 focus:bg-white focus:border-robogram-blue outline-none transition-all font-bold text-gray-900 shadow-sm" value={newClass.school} onChange={e => setNewClass({ ...newClass, school: e.target.value })} />

                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-2">담당 교사 (학교)</label>
                                        <input required type="text" placeholder="교사 성함" className="w-full px-5 py-4 rounded-xl border border-white bg-white/80 focus:bg-white focus:border-robogram-blue outline-none transition-all font-bold text-gray-900 shadow-sm mb-4" value={newClass.teacher} onChange={e => setNewClass({ ...newClass, teacher: e.target.value })} />
                                        <input required type="email" placeholder="교사 이메일" className="w-full px-5 py-4 rounded-xl border border-white bg-white/80 focus:bg-white focus:border-robogram-blue outline-none transition-all font-bold text-gray-900 shadow-sm" value={newClass.teacherEmail} onChange={e => setNewClass({ ...newClass, teacherEmail: e.target.value })} />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-bold text-gray-700 mb-2">배정 강사 (로보그램)</label>
                                        <input required type="text" placeholder="강사 성함" className="w-full px-5 py-4 rounded-xl border border-white bg-white/80 focus:bg-white focus:border-robogram-blue outline-none transition-all font-bold text-gray-900 shadow-sm mb-4" value={newClass.instructor} onChange={e => setNewClass({ ...newClass, instructor: e.target.value })} />

            const [detailSession, setDetailSession] = useState(null);
            const [printTarget, setPrintTarget] = useState('all');

            // [추가] 댓글 입력 텍스트 상태 및 핸들러 함수
            const [newCommentText, setNewCommentText] = useState('');

            // [추가] 고용량 이미지 압축 유틸리티 함수
            const compressExistingBase64 = (base64Str) => {
                return new Promise((resolve) => {
                    if (!base64Str || !base64Str.startsWith('data:image')) {
                        resolve(base64Str);
                        return;
                    }
                    const img = new Image();
                    img.onload = () => {
                        const MAX_SIZE = 600;
                        let width = img.width;
                        let height = img.height;

                        if (width > height && width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        } else if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressed = canvas.toDataURL('image/jpeg', 0.5); // 용량 확보를 위해 50% 퀄리티 압축
                        resolve(compressed);
                    };
                    img.onerror = () => resolve(base64Str);
                    img.src = base64Str;
                });
            };

            // [추가] 기존에 저장된 고용량 이미지 용량을 복구하는 자동 마이그레이션
            useEffect(() => {
                if (!userClass || !userClass.reports || userClass.reports.length === 0) return;

                const runImageMigration = async () => {
                    let needsMigration = false;
                    const updatedReports = await Promise.all(userClass.reports.map(async (report) => {
                        // base64 문자열의 크기가 대략 100KB(글자 수 130,000자 이상)를 넘으면 고압축 대상으로 분류
                        if (report.photoData && report.photoData.startsWith('data:image') && report.photoData.length > 50000) {
                            needsMigration = true;
                            const compressed = await compressExistingBase64(report.photoData);
                            return { ...report, photoData: compressed };
                        }
                        return report;
                    }));

                    if (needsMigration) {
                        try {
                            await updateClass(userClass.id, { reports: updatedReports });
                            alert("이전 차시에 등록되었던 고용량 현장사진 압축 최적화가 완료되었습니다!\n확인을 누르면 페이지가 새로고침되며 이제 정상적으로 보고서 저장이 가능합니다.");
                            window.location.reload();
                        } catch (err) {
                            console.error("기존 이미지 압축 마이그레이션 오류:", err);
                        }
                    }
                };

                runImageMigration();
            }, [userClass]);
            
            const handleAddComment = async () => {
                if (!newCommentText.trim()) return;

                    id: Date.now().toString(),
                    writerName: user.name,
                    writerRole: user.role, // 'admin', 'teacher', 'instructor'
                    content: newCommentText,
                    date: new Date().toLocaleString()
                };

                    if (r.id === detailSession.id) {
                        const existingComments = r.comments || [];
                        return { ...r, comments: [...existingComments, newComment] };
                    }
                    return r;
                });

                await updateClass(userClass.id, { reports: updatedReports });
                
                const updatedSession = updatedReports.find(r => r.id === detailSession.id);
                setDetailSession(updatedSession);
                setNewCommentText('');
            };

            const handleDeleteComment = async (commentId) => {

                    if (r.id === detailSession.id) {
                        const existingComments = r.comments || [];
                        const filteredComments = existingComments.filter(c => c.id !== commentId);
                        return { ...r, comments: filteredComments };
                    }
                    return r;

                await updateClass(userClass.id, { reports: updatedReports });

                    <button onClick={() => navigateTo(isAdmin ? 'admin' : 'dashboard')} className="mt-8 bg-white hover:bg-gray-50 border border-gray-200 text-gray-700 px-6 py-3 rounded-xl font-bold transition shadow-sm break-keep"><i className="fas fa-arrow-left mr-2"></i>이전 화면으로 돌아가기</button>
                </div>

            if (isTeacher && userClass.instructorSubmitted && !userClass.isFinalSubmitted) {

            let sessionDayMapping = [];

            const totalSessions = sessionDayMapping.length;

                        </div>

                        {/* 상태 안내 Alert 창들 (기존과 동일) */}
                        {isAdmin && !instructorSubmitted && (

                                <div><h4 className="text-lg font-black break-keep text-blue-900">강사 작성 중</h4><p className="text-base font-medium mt-1 break-keep">현재 강사님이 수시로 보고서를 작성 중입니다. 필요 시 관리자가 선제적으로 확인하고 수정할 수 있습니다.</p></div>

                        )}
                        {isInstructor && instructorSubmitted && !isFinalSubmitted && (
                            <div className="bg-amber-50/90 backdrop-blur-md border-l-4 border-amber-400 p-5 rounded-r-2xl text-amber-800 mb-8 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                <div className="flex items-start gap-4">
                                    <i className="fas fa-hourglass-half mt-1 text-[24px] text-amber-500"></i>
                                    <div>
                                        <h4 className="text-lg font-black break-keep text-amber-900">관리자 검토 중</h4>

                                <button

                                            await updateClass(userClass.id, { instructorSubmitted: false });

                        {isFinalSubmitted && (
